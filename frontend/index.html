<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXODINDO - Portal Enterprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; background: #050714; color: #fff;
      font-family: 'Inter', sans-serif; display: flex;
      justify-content: center; align-items: center; min-height: 100vh;
    }
    .portal-card {
      text-align: center; padding: 40px; background: #0A0E27;
      border: 1px solid rgba(108, 140, 255, 0.2); border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-width: 450px; width: 90%;
    }
    .logo-container img { width: 80px; height: 80px; margin-bottom: 20px; }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 28px; margin-bottom: 10px; letter-spacing: 2px; }
    p { color: #94A3B8; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
    .enter-btn {
      display: inline-block; padding: 12px 30px; border-radius: 8px;
      background: linear-gradient(135deg, #F0A500, #D4943A); color: #050714;
      text-decoration: none; font-weight: 700; font-size: 15px; transition: 0.3s;
    }
    .enter-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(240,165,0,0.4); }
  </style>
</head>
<body>

<div class="portal-card">
  <div class="logo-container">
    <img src="images/logo.svg" alt="EXODINDO Logo">
  </div>
  <h1>EXODINDO</h1>
  <p>Selamat datang di Pusat Manajemen Kreatif PT Exod Creative Indonesia. Silakan masuk ke Workspace Kontrak Kerja Sama.</p>
  <a href="contract.html" class="enter-btn">Buka Contract System →</a>
</div>

</body>
</html>
